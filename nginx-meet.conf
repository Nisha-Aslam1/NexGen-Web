# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR NEXGEN LIVEKIT MEETING SYSTEM
# Target Domain 1: https://meet.nexgencouncil.bond (Frontend & Express Backend)
# Target Domain 2: wss://livekit.nexgencouncil.bond (LiveKit WebRTC Server)
# ==============================================================================

# 1. Meeting Application & Web Portal (meet.nexgencouncil.bond)
server {
    listen 80;
    server_name meet.nexgencouncil.bond nexgencouncil.bond www.nexgencouncil.bond;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meet.nexgencouncil.bond nexgencouncil.bond www.nexgencouncil.bond;

    # SSL Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nexgencouncil.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexgencouncil.bond/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 50M;

    # Main Web App Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. LiveKit Server Signaling & WebRTC Proxy (livekit.nexgencouncil.bond)
server {
    listen 80;
    server_name livekit.nexgencouncil.bond;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name livekit.nexgencouncil.bond;

    ssl_certificate /etc/letsencrypt/live/livekit.nexgencouncil.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.nexgencouncil.bond/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy WebSocket & HTTP traffic to LiveKit Server container on port 7880
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
